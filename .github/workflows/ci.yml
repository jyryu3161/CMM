name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python-version: ["3.12"]
        # Also exercise the minimum supported Python (pyproject requires-python >= 3.10).
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # PyQt5's offscreen platform plugin needs a few system libraries on Linux. Windows and
      # macOS ship everything the wheels need.
      - name: Install Qt offscreen system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3

      # Keep the commercial solver outside the general matrix. Its bundled size-limited license
      # changes cobra's default solver and cannot execute all CMM test models reliably.
      - name: Install the locked open-source test environment
        run: >-
          uv sync --frozen
          --extra desktop --extra design --extra dev
          --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          uv run --no-sync ruff check src tests examples
          uv run --no-sync ruff format --check src tests examples

      - name: Type check scientific services
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: >-
          uv run --no-sync mypy
          src/cmm/core src/cmm/features src/cmm/omics
          src/cmm/workflows src/cmm/reporting

      - name: Validate citation and audit locked dependencies
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          uvx --from cffconvert==2.0.0 cffconvert --validate
          uv export --frozen \
            --extra desktop --extra design --extra dev --extra solver-gurobi \
            --no-emit-project -o "$RUNNER_TEMP/requirements-audit.txt"
          uvx --from pip-audit==2.10.1 pip-audit \
            -r "$RUNNER_TEMP/requirements-audit.txt" --disable-pip --require-hashes

      - name: Test the solver-neutral surface with branch coverage (offscreen Qt)
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage.general
          QT_QPA_PLATFORM: offscreen
        run: >-
          uv run --no-sync pytest -q -ra --strict-markers
          -m "not requires_qp and not requires_miqp"
          --durations=10
          --cov=cmm --cov-branch --cov-report=term-missing

      - name: Upload Linux 3.12 solver-neutral coverage
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-general-linux-py312
          path: ${{ runner.temp }}/.coverage.general
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1

      - name: Build and verify publication renderer package data
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          uv build --no-sources
          uv run --no-sync python - <<'PY'
          import subprocess
          import tarfile
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          if len(sdists) != 1:
              raise SystemExit(f"expected one sdist, found {sdists}")

          wheel_required = {
              "cmm/reporting/render_publication_figures.R",
              "cmm/reporting/render_transformation_figures.R",
              "cmm/resources/LICENSE.escher.txt",
          }
          with ZipFile(wheels[0]) as archive:
              wheel_names = set(archive.namelist())
              missing = sorted(wheel_required - wheel_names)
              if missing:
                  raise SystemExit(f"wheel is missing required package data: {missing}")
              empty = sorted(member for member in wheel_required if not archive.read(member).strip())
              if empty:
                  raise SystemExit(f"wheel contains empty required package data: {empty}")
              if any("/.agents/" in f"/{name}" or name.endswith("/SKILL.md") for name in wheel_names):
                  raise SystemExit("wheel must not install the repository-only agent skill")

          sdist_required = {
              "AGENTS.md",
              "THIRD_PARTY_NOTICES.md",
              "install.ps1",
              "install.sh",
              "renv.lock",
              ".agents/skills/cmm-production-engineering/SKILL.md",
              ".agents/skills/cmm-production-engineering/agents/openai.yaml",
              ".agents/skills/cmm-production-engineering/references/clarification-interview.md",
              ".agents/skills/cmm-transformation-engineering/SKILL.md",
              ".agents/skills/cmm-transformation-engineering/agents/openai.yaml",
              ".agents/skills/cmm-transformation-engineering/references/clarification-interview.md",
              "docs/AI-USAGE.md",
              "examples/README.md",
              "examples/production-targets/README.md",
              "examples/production-targets/prepare.py",
              "examples/production-targets/config.json",
              "examples/transformation-targets/README.md",
              "examples/transformation-targets/prepare.py",
              "examples/transformation-targets/config.json",
              "examples/transformation-targets/rmta.json",
              "evals/README.md",
              "evals/run_evals.py",
              "evals/tasks/sc01_production.json",
              "evals/tasks/sc02_transformation.json",
          }
          with tarfile.open(sdists[0], mode="r:gz") as archive:
              members = [member for member in archive.getmembers() if member.isfile()]
              relative = {
                  member.name.split("/", 1)[1] if "/" in member.name else member.name: member
                  for member in members
              }
              missing = sorted(sdist_required - set(relative))
              if missing:
                  raise SystemExit(f"sdist is missing publication-governance files: {missing}")
              forbidden_paths = sorted(
                  name
                  for name in relative
                  if name == "docs/analysis-2026-06-12.md"
                  or name == "docs/loop"
                  or name.startswith("docs/loop/")
                  or (name.startswith("examples/") and "/data/" in name)
              )
              if forbidden_paths:
                  raise SystemExit(f"sdist contains internal review artifacts: {forbidden_paths}")
              # MANIFEST.in includes docs and examples by pattern, so any stray file a
              # contributor leaves in those trees ships to users. The denylist above only
              # catches paths someone thought to name; requiring every shipped file to be
              # tracked catches the ones nobody predicted.
              tracked = {
                  path
                  for path in subprocess.run(
                      ["git", "ls-files", "-z"],
                      capture_output=True, text=True, check=True,
                  ).stdout.split("\0")
                  if path
              }
              untracked_paths = sorted(
                  name
                  for name in relative
                  if name not in tracked
                  and not name.startswith("src/cmm.egg-info/")
                  and name not in {"PKG-INFO", "setup.cfg"}
              )
              if untracked_paths:
                  raise SystemExit(
                      "sdist contains files that are not tracked by git; commit them or "
                      f"keep them out of the packaged trees: {untracked_paths}"
                  )
              # Source distributions must be portable and free of workstation-local paths.
              workstation_path_markers = (b"/users/", b":\\users\\")
              nonportable_hits = []
              for name, member in relative.items():
                  stream = archive.extractfile(member)
                  payload = stream.read() if stream is not None else b""
                  lowered_name = name.lower().encode()
                  lowered_payload = payload.lower()
                  if any(
                      marker in lowered_name or marker in lowered_payload
                      for marker in workstation_path_markers
                  ):
                      nonportable_hits.append(name)
              if nonportable_hits:
                  raise SystemExit(
                      "sdist contains nonportable workstation paths in: "
                      f"{sorted(nonportable_hits)}"
                  )
          PY

  solver-smoke:
    name: Restricted-license solver capability suite
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Qt offscreen system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3

      # The complete QP/MIQP-marked collection includes service, GUI, and screenshot-scenario
      # tests. One additional exact MILP node exercises both Gurobi-backed strain-design methods
      # and seed forwarding. The AST gate below keeps every historically oversized smoke path on
      # a real, deterministic six-reaction reroute that fits Gurobi's bundled restricted license.
      - name: Install the locked solver capability environment
        run: >-
          uv sync --frozen
          --extra desktop --extra dev --extra design --extra solver-gurobi
          --python 3.12

      # SC-02's complete MIQP tests also render and validate their real run bundles.
      # Keep their R dependency available in this required, no-skip test partition.
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: renv
          use-public-rspm: always

      - name: Install R graphics system libraries for solver workflow tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff-dev libjpeg-dev libwebp-dev pkg-config

      - name: Restore locked R for solver workflow tests
        uses: r-lib/actions/setup-renv@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: Expose restored R to solver workflow subprocesses
        shell: Rscript {0}
        run: |
          renv::load()
          cat(
            "R_LIBS_USER=", normalizePath(.libPaths()[[1]], winslash = "/"), "\n",
            sep = "", file = Sys.getenv("GITHUB_ENV"), append = TRUE
          )

      - name: Prove restricted solver smoke tests use six-reaction models
        run: |
          uv run --no-sync python - <<'PY'
          import ast
          from pathlib import Path

          expected_fixtures = {
              "tests/test_comparison.py": {
                  "test_l2_moma_reroutes_after_knockout",
                  "test_moma_l2_distance_is_the_root_of_the_qp_objective",
              },
              "tests/test_validation.py": {"test_moma_matches_cobra"},
              "tests/test_transformation_workflow.py": {"transformation_inputs"},
          }
          def module_functions(filename):
              module = ast.parse(Path(filename).read_text(encoding="utf-8"))
              return {
                  node.name: node
                  for node in module.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              }

          for filename, function_names in expected_fixtures.items():
              functions = module_functions(filename)
              for function_name in function_names:
                  function = functions[function_name]
                  fixtures = {argument.arg for argument in function.args.args}
                  if "branched_model" not in fixtures or "ecoli_core" in fixtures:
                      raise SystemExit(
                          f"{filename}::{function_name} is not restricted to branched_model"
                      )

          app_functions = module_functions("tests/test_app_smoke.py")
          app_function_name = "test_moma_comparison_names_the_quantity_it_reports"
          app_function = app_functions[app_function_name]
          app_fixtures = {argument.arg for argument in app_function.args.args}
          app_calls = {
              node.func.id
              for node in ast.walk(app_function)
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
          }
          if "ecoli_core" in app_fixtures or "build_demo_model" not in app_calls:
              raise SystemExit(
                  f"tests/test_app_smoke.py::{app_function_name} is not restricted to "
                  "build_demo_model"
              )

          provenance_functions = module_functions("tests/test_provenance_surface.py")
          metadata_function = provenance_functions["_metadata"]
          required_services = {"transformation_targets", "revert_targets"}
          routed = False
          for node in ast.walk(metadata_function):
              if not isinstance(node, ast.If):
                  continue
              names = {
                  child.value
                  for child in ast.walk(node.test)
                  if isinstance(child, ast.Constant) and isinstance(child.value, str)
              }
              calls = {
                  child.func.id
                  for statement in node.body
                  for child in ast.walk(statement)
                  if isinstance(child, ast.Call) and isinstance(child.func, ast.Name)
              }
              if required_services <= names and "_directional_metadata" in calls:
                  routed = True
                  break
          directional_function = provenance_functions["_directional_metadata"]
          directional_calls = {
              node.func.id
              for node in ast.walk(directional_function)
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
          }
          if not routed or "_comparison_model" not in directional_calls:
              raise SystemExit(
                  "transformation_targets/revert_targets provenance cases are not routed "
                  "through the six-reaction comparison model"
              )
          PY

      - name: Collect the complete solver capability test universe
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run --no-sync pytest --collect-only -q --color=no --strict-markers \
            -m "requires_qp or requires_miqp" \
            > "$RUNNER_TEMP/solver-capability-marked-nodes.txt"
          uv run --no-sync pytest --collect-only -q --color=no --strict-markers \
            tests/test_strain_design.py::test_restricted_license_strain_design_forwards_seed \
            > "$RUNNER_TEMP/solver-capability-milp-nodes.txt"
          uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          marked_collection = root / "solver-capability-marked-nodes.txt"
          milp_collection = root / "solver-capability-milp-nodes.txt"
          marked = {
              line.strip()
              for line in marked_collection.read_text(encoding="utf-8").splitlines()
              if line.startswith("tests/") and "::" in line
          }
          milp = {
              line.strip()
              for line in milp_collection.read_text(encoding="utf-8").splitlines()
              if line.startswith("tests/") and "::" in line
          }
          expected_marked_count = 73
          expected_milp = {
              "tests/test_strain_design.py::"
              "test_restricted_license_strain_design_forwards_seed"
          }
          if len(marked) != expected_marked_count:
              raise SystemExit(
                  "solver capability collection changed: "
                  f"expected {expected_marked_count} marked nodes, collected {len(marked)}; "
                  "review every added or removed QP/MIQP test and update the audited count"
              )
          if milp != expected_milp:
              raise SystemExit(
                  "audited strain-design MILP collection changed: "
                  f"expected {sorted(expected_milp)}, collected {sorted(milp)}"
              )
          expected = marked | milp
          (root / "solver-capability-nodes.txt").write_text(
              "".join(f"{node}\n" for node in sorted(expected)),
              encoding="utf-8",
          )
          print(
              f"audited solver capability collection: {len(marked)} marked + "
              f"{len(milp)} explicit MILP = {len(expected)} tests"
          )
          PY

      - name: Run every restricted-license solver capability test
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage.solver
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run --no-sync pytest -q -ra --strict-markers \
            -m "requires_qp or requires_miqp" \
            --durations=10 \
            --cov=cmm --cov-branch --cov-report= \
            --junitxml="$RUNNER_TEMP/solver-capability-marked-results.xml"
          uv run --no-sync pytest -q -ra --strict-markers \
            tests/test_strain_design.py::test_restricted_license_strain_design_forwards_seed \
            --cov=cmm --cov-branch --cov-append --cov-report= \
            --junitxml="$RUNNER_TEMP/solver-capability-milp-results.xml"

      - name: Prove every collected solver capability test executed
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          root = Path(os.environ["RUNNER_TEMP"])
          collection = root / "solver-capability-nodes.txt"
          expected = {
              line.strip()
              for line in collection.read_text(encoding="utf-8").splitlines()
              if line.startswith("tests/") and "::" in line
          }
          report_paths = (
              root / "solver-capability-marked-results.xml",
              root / "solver-capability-milp-results.xml",
          )
          suites = []
          for report_path in report_paths:
              report = ElementTree.parse(report_path)
              suites.extend(report.getroot().iter("testsuite"))
          if len(suites) != len(report_paths):
              raise SystemExit(
                  f"expected {len(report_paths)} pytest JUnit suites, found {len(suites)}"
              )
          cases = [case for suite in suites for case in suite.findall("testcase")]
          executed_list = [
              f"{case.attrib['classname'].replace('.', '/')}.py::{case.attrib['name']}"
              for case in cases
          ]
          executed = set(executed_list)
          unexecuted = sorted(expected - executed)
          unexpected = sorted(executed - expected)
          duplicate_count = len(executed_list) - len(executed)
          skipped = [case for case in cases if case.find("skipped") is not None]
          failed = [
              case
              for case in cases
              if case.find("failure") is not None or case.find("error") is not None
          ]
          if unexecuted or unexpected or duplicate_count or skipped or failed:
              raise SystemExit(
                  "solver capability execution does not match its collection: "
                  f"unexecuted={unexecuted}, unexpected={unexpected}, "
                  f"duplicates={duplicate_count}, skipped={len(skipped)}, "
                  f"failed={len(failed)}"
              )
          print(f"executed all {len(executed)} solver capability tests with no exceptions")
          PY

      - name: Upload restricted-solver coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-restricted-solver-linux-py312
          path: ${{ runner.temp }}/.coverage.solver
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1

  publication-report:
    name: R publication report / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: renv
          # Linux/Windows use Posit binaries by default. `always` opts macOS into its binary
          # repository as well; archived packages may still compile when no R 4.3 binary exists.
          use-public-rspm: always
          # On Windows setup-r derives and installs the suitable Rtools release from R 4.3.
          windows-path-include-rtools: true

      - name: Install R graphics system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libfreetype-dev \
            libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff-dev libjpeg-dev libwebp-dev pkg-config

      - name: Install R graphics system libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install freetype harfbuzz fribidi libpng jpeg-turbo libtiff webp pkg-config
          echo "CPPFLAGS=-I$(brew --prefix libpng)/include -I$(brew --prefix freetype)/include/freetype2" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix libpng)/lib -L$(brew --prefix freetype)/lib" >> "$GITHUB_ENV"
          echo "CPATH=$(brew --prefix)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix libpng)/lib/pkgconfig:$(brew --prefix freetype)/lib/pkgconfig:$(brew --prefix harfbuzz)/lib/pkgconfig:$(brew --prefix fribidi)/lib/pkgconfig:$(brew --prefix jpeg-turbo)/lib/pkgconfig:$(brew --prefix libtiff)/lib/pkgconfig:$(brew --prefix webp)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Restore the locked R publication environment
        uses: r-lib/actions/setup-renv@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      # The renderer intentionally invokes `Rscript --vanilla`. Export the restored project
      # library explicitly so that subprocess cannot fall back to an unrelated user library.
      - name: Expose the restored renv library to vanilla R subprocesses
        shell: Rscript {0}
        run: |
          renv::load()
          cat(
            "R_LIBS_USER=", normalizePath(.libPaths()[[1]], winslash = "/"), "\n",
            sep = "", file = Sys.getenv("GITHUB_ENV"), append = TRUE
          )

      - name: Install focused Python test dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Verify locked R dependency closure and renderer packages
        shell: Rscript --vanilla {0}
        run: |
          packages <- c("jsonlite", "ggplot2", "ggrepel", "patchwork", "svglite", "ragg")
          available <- vapply(packages, requireNamespace, logical(1), quietly = TRUE)
          if (!all(available)) {
            stop(
              sprintf(
                "missing required renderer package(s): %s",
                paste(packages[!available], collapse = ", ")
              ),
              call. = FALSE
            )
          }
          lock <- jsonlite::read_json("renv.lock", simplifyVector = FALSE)
          locked_packages <- names(lock$Packages)
          dependency_fields <- c("Depends", "Imports", "LinkingTo")
          dependency_specs <- unlist(lapply(lock$Packages, function(record) {
            fields <- intersect(dependency_fields, names(record))
            unlist(record[fields], use.names = FALSE)
          }), use.names = FALSE)
          dependency_names <- unique(trimws(sub("\\s*\\(.*\\)\\s*$", "", dependency_specs)))

          installed <- utils::installed.packages(lib.loc = .libPaths(), noCache = TRUE)
          priorities <- installed[, "Priority"]
          standard_packages <- unique(rownames(installed)[
            !is.na(priorities) & priorities %in% c("base", "recommended")
          ])
          missing_dependencies <- setdiff(
            dependency_names,
            c("R", locked_packages, standard_packages)
          )
          if (length(missing_dependencies) > 0L) {
            stop(
              sprintf(
                "renv.lock is not dependency-closed; missing hard dependency record(s): %s",
                paste(sort(missing_dependencies), collapse = ", ")
              ),
              call. = FALSE
            )
          }

          project_library <- normalizePath(.libPaths()[[1]], winslash = "/", mustWork = TRUE)
          project_installed <- utils::installed.packages(
            lib.loc = project_library,
            noCache = TRUE
          )
          project_priorities <- project_installed[, "Priority"]
          project_nonstandard <- unique(rownames(project_installed)[
            is.na(project_priorities) |
              !project_priorities %in% c("base", "recommended")
          ])
          # setup-renv bootstraps `renv`, but `renv` is itself lockfile-controlled. No unpinned
          # bootstrap package is allowed in the active project library.
          bootstrap_allowances <- character()
          unexpected_packages <- setdiff(
            project_nonstandard,
            c(locked_packages, bootstrap_allowances)
          )
          missing_project_packages <- setdiff(
            setdiff(locked_packages, standard_packages),
            project_nonstandard
          )
          if (length(unexpected_packages) > 0L || length(missing_project_packages) > 0L) {
            stop(
              sprintf(
                paste0(
                  "restored project library differs from the non-base lock closure: ",
                  "unexpected=%s; missing=%s"
                ),
                paste(sort(unexpected_packages), collapse = ", "),
                paste(sort(missing_project_packages), collapse = ", ")
              ),
              call. = FALSE
            )
          }
          cat(sprintf(
            "R dependency closure: %d locked packages; %d hard dependencies; ",
            length(locked_packages),
            length(dependency_names)
          ))
          cat(sprintf(
            "%d project non-base packages; 0 bootstrap allowances\n",
            length(project_nonstandard)
          ))
          locked_available <- vapply(
            locked_packages, requireNamespace, logical(1), quietly = TRUE
          )
          if (!all(locked_available)) {
            stop(
              sprintf(
                "renv restore omitted locked package(s): %s",
                paste(locked_packages[!locked_available], collapse = ", ")
              ),
              call. = FALSE
            )
          }
          actual <- vapply(locked_packages, function(package) {
            as.character(utils::packageVersion(package))
          }, character(1))
          expected <- vapply(locked_packages, function(package) {
            lock$Packages[[package]]$Version
          }, character(1))
          matches <- mapply(
            function(expected_version, actual_version) {
              utils::compareVersion(expected_version, actual_version) == 0L
            },
            expected,
            actual,
            USE.NAMES = FALSE
          )
          comparison <- data.frame(
            package = locked_packages,
            expected = unname(expected),
            actual = unname(actual),
            matches = matches,
            check.names = FALSE
          )
          print(comparison, row.names = FALSE)
          actual_r <- as.character(getRversion())
          expected_r <- lock$R$Version
          cat(sprintf("R expected=%s actual=%s\n", expected_r, actual_r))
          if (actual_r != expected_r || any(!comparison$matches)) {
            mismatches <- comparison[!comparison$matches, , drop = FALSE]
            details <- character()
            if (nrow(mismatches) > 0L) {
              details <- apply(mismatches, 1L, function(row) {
                sprintf(
                  "%s expected=%s actual=%s",
                  row[["package"]], row[["expected"]], row[["actual"]]
                )
              })
            }
            if (actual_r != expected_r) {
              details <- c(details, sprintf("R expected=%s actual=%s", expected_r, actual_r))
            }
            stop(
              sprintf("locked R environment version mismatch: %s", paste(details, collapse = "; ")),
              call. = FALSE
            )
          }
          if (utils::packageDescription("ggplot2")$NeedsCompilation != "no") {
            stop("ggplot2 unexpectedly declares native compilation", call. = FALSE)
          }

      - name: Test schema validation and R publication rendering
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage.publication
        run: >-
          uv run --no-sync pytest -q -ra
          tests/test_publication_reporting.py
          tests/test_transformation_reporting.py
          --cov=cmm --cov-branch --cov-report=

      - name: Upload locked-R publication coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-publication-linux-py312
          path: ${{ runner.temp }}/.coverage.publication
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1

  coverage:
    name: Combined general, solver, and publication branch coverage
    needs: [test, solver-smoke, publication-report]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every test partition to pass
        env:
          GENERAL_RESULT: ${{ needs.test.result }}
          PUBLICATION_RESULT: ${{ needs.publication-report.result }}
          SOLVER_RESULT: ${{ needs.solver-smoke.result }}
        run: |
          test "$GENERAL_RESULT" = "success"
          test "$SOLVER_RESULT" = "success"
          test "$PUBLICATION_RESULT" = "success"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Download all Linux coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*-linux-py312
          path: ${{ runner.temp }}/coverage-data
          merge-multiple: true

      - name: Install locked coverage tooling
        run: uv sync --frozen --extra dev --python 3.12

      - name: Enforce combined branch coverage
        run: |
          test -s "$RUNNER_TEMP/coverage-data/.coverage.general"
          test -s "$RUNNER_TEMP/coverage-data/.coverage.solver"
          test -s "$RUNNER_TEMP/coverage-data/.coverage.publication"
          uv run --no-sync coverage combine "$RUNNER_TEMP/coverage-data"
          uv run --no-sync coverage report --show-missing --fail-under=80
